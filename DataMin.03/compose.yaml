name: datamind03

x-airflow: &airflow
  image: datamind03-airflow:3.3.2
  build: .
  user: "50000:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: datamind03:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/private/passwords.json
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres-meta:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "20"
    DATAMIND_DB_DSN: postgresql://datamind:${DATAMIND_DB_PASSWORD}@postgres-data:5432/datamind03
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/airflow/project/src:ro
    - "../Fonte de Dados:/opt/airflow/project/fonteDado:ro"
    - ./sql:/opt/airflow/project/sql:ro
    - ./data/raw:/opt/airflow/project/data/raw:ro
    - ./outputs/fase1:/opt/airflow/project/evidence:ro
    - ./outputs/analytics:/opt/airflow/project/published
    - ./runtime/etl:/opt/airflow/project/work
    - ./runtime/private:/opt/airflow/private
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres-meta:
      condition: service_healthy
    postgres-data:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres-meta:
    image: postgres:17.6
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres-meta:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres-data:
    image: postgres:17.6
    environment:
      POSTGRES_USER: datamind
      POSTGRES_PASSWORD: ${DATAMIND_DB_PASSWORD}
      POSTGRES_DB: datamind03
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U datamind -d datamind03"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    command: db migrate
    restart: "no"

  airflow-api:
    <<: *airflow
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/api/v2/monitor/health]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8974/health]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    healthcheck:
      test: [CMD-SHELL, "airflow jobs check --job-type DagProcessorJob --local"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 40s

volumes:
  postgres-meta:
  postgres-data:
  airflow-logs:
